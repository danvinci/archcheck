# Real packages through ArchCheck's default gate: each row pins a release and lists the error kinds its source holds.
# A kind ArchCheck reports wrongly stays off its row, so the row fails until the check is fixed.
[packages]
AbstractTrees = { version = "0.4.5", errors = [] }
Accessors = { version = "0.1.45", errors = [] }
Aqua = { version = "0.8.18", errors = [] }
CodeTracking = { version = "3.0.2", errors = [] }
# Base arithmetic on ColorTypes' XYZ and LMS: `+(a::Linear3, b::Linear3)` in src/algorithms.jl.
Colors = { version = "0.13.2", errors = ["module_piracy"] }
DataStructures = { version = "0.19.6", errors = [] }
FillArrays = { version = "1.17.1", errors = [] }
ForwardDiff = { version = "1.4.6", errors = [] }
JSON = { version = "1.10.0", errors = [] }
# The root and its Tokenize module each export `tokenize` and `untokenize`, bound to different functions.
JuliaSyntax = { version = "1.0.2", errors = ["duplicate_owner"] }

# Layouts the rows above lack.
# src/precompile.jl sits outside the spine: its include is commented out.
ColorTypes = { version = "0.12.3", errors = ["unranked_file"] }
# Definitions behind version guards the running Julia skips; an extension that loads with LinearAlgebra.
Compat = { version = "4.18.1", errors = [] }
# A Clang-generated C wrapper (src/gen/libhighs.jl) over a binary package.
HiGHS = { version = "1.26.0", errors = [] }
# Directory submodules with their own spines, a code generator left in src/, and FileFormats' readers (CBF, LP,
# MOF, ...) included by a readdir loop, so no file places their modules.
MathOptInterface = { version = "1.54.0", errors = ["nonliteral_include", "unranked_file", "unranked_module"] }
# @generated kernels on types StaticArraysCore owns; its own Aqua run marks the piracy test broken.
StaticArrays = { version = "1.9.23", errors = ["module_piracy"] }
