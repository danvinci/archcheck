# Dart pins and the evidence-table rows. Kind names follow the plan's check names.
module = "Dart"
repo = "/home/dan/lab/projects/dart"

[states.stack]
commit = "88db4a8ee69023e23fad4e2b42cd17cc84c41392"

[states.stack.workload]
file = "workloads/dart_build.jl"
call = "corpus_build"

[states.builders]
commit = "bdb133c611f7b6934cec9dcaa218e92dacfde6d7"

[states.builders.workload]
file = "workloads/dart_build.jl"
call = "corpus_build"

[mutants.kernels]
base = "builders"
source = "stack"
script = "mutants/vector_kernels.jl"

[mutants.kernels.workload]
file = "workloads/dart_build.jl"
call = "corpus_build"

[checks.StorageOverloads]

[checks.OverlappingCalls]

[checks.KeptBuilders]

[checks.ExpressionClones]
min_nodes = 20

[checks.ToleranceSearch]
args = ["GEOM_EPS", "RESOLUTION_M", "LOFT_GEO_M"]

[checks.UnreachedMethods]

[checks.Rebuilds]

[checks.TwoNames]

[checks.Waits]

[probes]
functions = ["offset", "duct_flow_section", "Shape", "_filled", "emit_artifacts", "write_renders", "_emit_component"]
